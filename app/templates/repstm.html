<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REP / STM · Export Claim</title>
<link rel="stylesheet" href="/static/app.css?v={{ v }}">
</head>
<body class="no-footer">
{% set active = "repstm" %}{% include "_top.html" %}
<main>
  <div class="page-head"><h2>REP / STM</h2><p>นำเข้าผลตอบรับ (REP) และใบชดเชย (STM) ของประกันสังคม และ STM ข้าราชการ (.xls) · ใช้แสดงสถานะในหน้า SSOP</p></div>

  <section class="panel import-panel">
    <label id="drop" class="drop" for="files">
      <span class="drop-icon" aria-hidden="true">⇪</span>
      <strong>ลากไฟล์ ZIP มาวาง หรือคลิกเพื่อเลือกไฟล์</strong>
      <span class="sub">REP: 10866_SOCDBIL_xxxxxxx.ZIP · STM: 10866_SOGNSTM_yyyymm.ZIP · STM ข้าราชการ: STM_10866_OPyyyymm_nn.xls · เลือกได้หลายไฟล์พร้อมกัน</span>
      <input id="files" type="file" multiple accept=".zip,.ZIP,.bil,.BIL,.xml,.XML,.xls,.XLS" class="sr-only">
    </label>
    <ul id="import-log" class="import-log"></ul>
  </section>

  <form id="vn-search" class="panel search vn-search">
    <label>ดูประวัติ VN<input name="vn" inputmode="numeric" autocomplete="off" placeholder="เช่น 691015205653"></label>
    <div class="actions-cell"><button class="primary" type="submit">ดูประวัติ</button></div>
  </form>

  <section class="panel table-panel" id="lists"></section>
</main>

<div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="รายละเอียด REP/STM">
  <div class="drawer-head"><div><h2 id="drawer-title"></h2><span id="drawer-sub" class="sub"></span></div><button type="button" id="drawer-close" class="ghost">ปิด ✕</button></div>
  <div id="drawer-body"></div>
</aside>
<script src="/static/common.js?v={{ v }}"></script>
<script src="/static/repstm.js?v={{ v }}"></script>
</body>
</html>
