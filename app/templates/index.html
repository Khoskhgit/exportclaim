<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ส่งออก SSOP</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div>
    <h1>ส่งออก SSOP</h1>
    <p>ผู้ป่วยนอกสิทธิประกันสังคม อ่านข้อมูลจาก HOSxP</p>
  </div>
  <nav class="menu" aria-label="เมนู"><a href="/" aria-current="page">SSOP ผู้ป่วยนอก</a><a href="/aipn">AIPN ผู้ป่วยใน</a></nav>
  <div id="connection" class="connection">กำลังตรวจการเชื่อมต่อ…</div>
</header>
<div id="notices"></div>
<main>
  <form id="search" class="panel search">
    <label>ตั้งแต่วันที่<input type="date" name="start"></label>
    <label>ถึงวันที่<input type="date" name="end"></label>
    <label class="wide">สิทธิ
      <details id="pttypes" class="multi"><summary id="pttype-label">กำลังโหลด…</summary><div id="pttype-list"></div></details>
    </label>
    <label>VN<input name="vn" inputmode="numeric" autocomplete="off"></label>
    <label>HN<input name="hn" autocomplete="off"></label>
    <button class="primary" type="submit">ค้นหา</button>
  </form>

  <section id="summary" class="chips" aria-label="กรองตามสถานะ"></section>

  <section class="panel table-panel">
    <div class="table-tools">
      <input id="filter" type="search" placeholder="กรองจากชื่อ, VN, HN หรือ PDx" aria-label="กรองรายการ">
      <button type="button" id="select-ready">เลือกรายการที่ผ่าน</button>
      <button type="button" id="select-none">ยกเลิกทั้งหมด</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th></th><th>ผลตรวจ</th><th>สถานะส่ง</th><th>VN</th><th>HN</th><th>ชื่อ</th><th>วันที่มาตรวจ</th><th>PDx</th><th class="num">ค่าใช้จ่าย</th><th>ปัญหาที่พบ</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty">กรอกช่วงวันที่แล้วกดค้นหา</p>
    </div>
  </section>

  <details class="panel history">
    <summary>ประวัติการส่งออก</summary>
    <div id="history"></div>
    <div class="zupload">
      <label>นำเข้ารหัส Z ที่เบิกได้ (.xlsx, รหัสคอลัมน์ B, คำอธิบายคอลัมน์ C)
        <input id="zfile" type="file" accept=".xlsx"></label>
    </div>
  </details>
</main>

<footer class="actions">
  <div class="totals"><strong id="selected-count">เลือก 0 คน</strong><span id="selected-total">ค่าใช้จ่าย 0.00 บาท</span></div>
  <label>Station<input id="station" inputmode="numeric" maxlength="2" value="{{ station }}" data-default="{{ station }}" required></label>
  <label>Session No<input id="session" inputmode="numeric" maxlength="4" required></label>
  <label>ประเภท
    <select id="tflag"><option value="A">A: ขอเบิก</option><option value="E">E: แก้ไข</option><option value="D">D: ยกเลิก</option></select>
  </label>
  <button id="export" class="primary" type="button" disabled>ตรวจแล้ว สร้าง ZIP</button>
</footer>

<aside id="drawer" class="drawer" hidden aria-label="รายละเอียด visit">
  <div class="drawer-head"><h2 id="drawer-title"></h2><button type="button" id="drawer-close">ปิด</button></div>
  <div id="drawer-body"></div>
</aside>

<dialog id="confirm">
  <h2 id="confirm-title"></h2>
  <div id="confirm-body"></div>
  <div class="dialog-actions">
    <button type="button" id="confirm-cancel">ยกเลิก</button>
    <button type="button" id="confirm-ok" class="primary">ยืนยัน</button>
  </div>
</dialog>
<script src="/static/common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
